name: Bootstrap npm lockfile

on:
  push:
    branches:
      - hardening/tier8-supply-chain-20260830

permissions:
  contents: write

concurrency:
  group: omni-lockfile-bootstrap
  cancel-in-progress: true

jobs:
  lockfile:
    if: github.actor == 'idiosynsatiable'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Generate lockfile without executing dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify bootstrap touched only the lockfile
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | awk '{print $2}')"
          if [ -z "$changed" ]; then
            echo "Lockfile already current."
            exit 0
          fi
          unexpected="$(printf '%s\n' "$changed" | grep -v '^package-lock.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated changes:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && [ -f package-lock.json ]; then
            echo "No lockfile change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add reproducible npm lockfile"
          git push origin HEAD:hardening/tier8-supply-chain-20260830
